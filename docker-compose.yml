services:
  volta:
    build: .
    image: volta-local:latest
    container_name: volta
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"     # web UI + API (keep private / behind VPN)
      - "10086:10086"   # strip controller (strips dial in from home)
    volumes:
      - ./strips.json:/app/strips.json
      - ./analytics.db:/app/analytics.db
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - localai_net
networks:
  localai_net:
    name: localai_default
    external: true
